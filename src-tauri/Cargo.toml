[package]
name = "tusk"
version = "0.14.0"
description = "A fast, modern PostgreSQL client"
edition = "2021"

[lib]
name = "tusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
dirs = "6"
russh-sftp = "3"
portable-pty = "0.9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
flate2 = "1"
rand = "0.8"
tauri-plugin-notification = "2"
suppaftp = { version = "12", features = ["tokio-rustls-ring"] }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff", features = ["rustls-ring"] }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff", features = ["alloc"] }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-input = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-rdpsnd-native = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
sha2 = "0.10"
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
ironrdp-cliprdr-native = { git = "https://github.com/Devolutions/IronRDP", rev = "637f838ea0e2adcfbfddc94b147958ec672898ff" }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
