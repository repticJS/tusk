name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # ---- Releases: pushing a tag like v0.2.0 publishes a signed release.
      # Installed copies of Tusk read latest.json from the newest release and
      # update themselves.

      - name: Check signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and variables > Actions) to publish updates."
            exit 1
          fi

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/changelog.mjs "${GITHUB_REF_NAME}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tusk ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # ---- Everything else: test builds, downloadable from the run's artifacts.
      # Updater artifacts need the signing key, so they're skipped here.

      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: tusk-windows
          path: |
            src-tauri/target/release/tusk.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
