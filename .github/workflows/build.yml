name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # A push to main whose version (tauri.conf.json) has no release yet
      # publishes one; pushing a v* tag does too.
      - name: Detect release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
               && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "New version $version: publishing a release"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # ---- Releases: signed, published, and read by installed copies of Tusk
      # (latest.json) so they update themselves.

      - name: Check signing key
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings > Secrets and variables > Actions) to publish updates."
            exit 1
          fi

      - name: Release notes
        if: steps.release.outputs.publish == 'true'
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            node scripts/changelog.mjs "${{ steps.release.outputs.version }}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and publish release
        if: steps.release.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.release.outputs.version }}
          releaseName: Tusk v${{ steps.release.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # ---- Everything else: test builds, downloadable from the run's artifacts.
      # Updater artifacts need the signing key, so they're skipped here.

      - name: Build
        if: steps.release.outputs.publish != 'true'
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        if: steps.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tusk-windows
          path: |
            src-tauri/target/release/tusk.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
